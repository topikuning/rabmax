[project]
name = "boq-app-backend"
version = "0.1.0"
description = "BOQ Generator backend for Indonesian government tender lelang"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
    # Excel I/O
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    # Auth / security
    "bcrypt>=4.1.0",
    # AI providers
    "anthropic>=0.39.0",
    "mistralai>=1.2.0",
    "openai>=1.54.0",
    # Utils
    "loguru>=0.7.2",
    "python-multipart>=0.0.17",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    # Scraping (for master data seeding)
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "T20"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
