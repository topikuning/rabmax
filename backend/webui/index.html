<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOQ Generator</title>

  <!-- Reporter error minimal (dipakai juga oleh app.js) -->
  <script>
    window.__boqError = function (msg, stack) {
      var d = document.getElementById('boq-error');
      if (!d) {
        d = document.createElement('div');
        d.id = 'boq-error';
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#c0272d;color:#fff;' +
          'font:12px/1.5 monospace;padding:12px;white-space:pre-wrap;max-height:60%;overflow:auto';
        (document.body || document.documentElement).appendChild(d);
      }
      d.textContent = 'BOQ: ' + msg + (stack ? '\n\n' + stack : '');
    };
    window.__extVer = '4.2.1';
  </script>

  <!-- ExtJS 4.2.1 (GPL v3) dari cdnjs — tema klasik standar.
       Ganti versi/tema di sini jika perlu. -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/extjs/4.2.1/resources/css/ext-all.css"
        onerror="window.__boqError('Tema ExtJS (CSS) gagal dimuat dari CDN — tampilan akan blank. Ganti URL CSS di index.html.')">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/extjs/4.2.1/ext-all.js"
          onerror="window.__boqError('ext-all.js gagal dimuat dari CDN. Cek URL/koneksi/pemblokir.')"></script>

  <style>
    .boq-header-title { font-size: 16px; font-weight: bold; color: #fff; }
    .risk-low { color:#c0272d; font-weight:bold; }
  </style>

  <script src="app.js"></script>
</head>
<body></body>
</html>
